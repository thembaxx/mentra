name: Visual learning verification
on:
  pull_request:
    paths:
      - 'components/InteractiveVisualLab.tsx'
      - 'components/FlashcardDeckStudio.tsx'
      - 'components/MathRenderer.tsx'
      - 'components/PhysicsUI.tsx'
      - 'components/QuestionGeneratorStudio.tsx'
      - 'app/globals.css'
      - '.github/workflows/visual-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
