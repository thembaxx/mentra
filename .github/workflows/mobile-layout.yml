name: Compact mobile layout
on:
  pull_request:
    paths:
      - "app/page.tsx"
      - "components/DailyStudyGoalCard.tsx"
      - "tests/mobile-layout.mjs"
      - ".github/workflows/mobile-layout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the production app
        run: npm run build
      - name: Install CI-only Chromium browser runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/mentra-mobile-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mentra-mobile-server.log
          exit 1
      - name: Verify 320px, 360px, 390px and 768px viewport boundaries
        run: node tests/mobile-layout.mjs
      - name: Preserve actual Chromium viewport screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mentra-compact-mobile-evidence
          path: test-results/mobile-layout/
          if-no-files-found: ignore
          retention-days: 7
