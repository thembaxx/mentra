name: One-time TypeScript compatibility repair
on:
  push:
    branches: [chore/deps-latest-stable-20261022]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use supported stable TypeScript release
        run: |
          npm install --save-dev 'typescript@~6.0.3' --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit TypeScript compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-upgrade-repair.yml
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): pin latest TypeScript 6 for ESLint compatibility'
            git push
          fi
