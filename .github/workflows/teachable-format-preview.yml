name: Temporary teachable-figure format preview
on:
  push:
    branches:
      - feature/teachable-figures-guided-experiments
  pull_request:
    branches:
      - main
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and emit changed file contents
        run: |
          ./node_modules/.bin/oxfmt --write components/GuidedFigure.tsx components/InteractiveVisualLab.tsx docs/teachable-figures.md lib/teachable-lessons.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ["components/GuidedFigure.tsx","components/InteractiveVisualLab.tsx","docs/teachable-figures.md","lib/teachable-lessons.ts"]:
              print("FMT_RESULT|" + name + "|" + json.dumps(Path(name).read_text(), ensure_ascii=True))
          PY
