name: Temporary fallback browser-script formatter
on:
  push:
    branches:
      - feat/webgl-fallback-hero-nov26
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx --no-install oxfmt scripts/verify-hero-fallback.mjs
      - name: Apply one-time script formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add scripts/verify-hero-fallback.mjs
            git commit -m 'style: format WebGL fallback browser QA script'
            git push origin HEAD:feat/webgl-fallback-hero-nov26
          fi
